<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' about: data:; object-src 'none'; base-uri 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Tester</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="views.css">
</head>
<body>
<div id="app">
    <header id="topbar">
        <div class="brand" title="API Tester">
            <div class="brand-logo" id="brand-logo"></div>
            <div class="brand-title">API Tester</div>
        </div>
        <div class="topbar-sep"></div>
        <div class="env-picker" id="env-picker"></div>
        <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div id="workspace">
        <aside id="sidebar"></aside>
        <div class="resizer-x" id="sidebar-resizer" title="Drag to resize"></div>
        <main id="main">
            <div id="tabbar">
                <div id="doc-tabs" role="tablist"></div>
                <div class="tabbar-actions" id="tabbar-actions"></div>
            </div>
            <div id="tab-content"></div>
        </main>
    </div>
    <footer id="statusbar"></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="js/util.js"></script>
<script src="js/views/jsonview.js"></script>
<script src="js/views/sidebar.js"></script>
<script src="js/views/request.js"></script>
<script src="js/views/response.js"></script>
<script src="js/views/suiteEditor.js"></script>
<script src="js/views/environments.js"></script>
<script src="js/views/runner.js"></script>
<script src="js/views/importExport.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/welcome.js"></script>
<script src="js/views/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
